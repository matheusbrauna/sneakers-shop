query GetOtherSneakers($brandId: ID) {
  sneakers(where: {brand: {id: $brandId}}) {
    id
    name
    description
    price
    quantity
    slug
    brand {
      id
      name
    }
    category {
      slug
      name
    }
    coverImg {
      url
    }
    images {
      url
    }
    ratings {
      stars
    }
  }
}